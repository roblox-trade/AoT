<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - AOT Skins</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(45deg, #000, #1a0033);
            color: #ff00ff;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        h1 {
            font-size: 5rem;
            text-shadow: 0 0 20px #ff00ff,
                         0 0 40px #00ffff;
            animation: glitch 0.5s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, -5px); }
            60% { transform: translate(-3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }
        .subtitle {
            font-size: 2rem;
            margin-top: 20px;
            color: #00ffff;
        }
    </style>
</head>
<body>
    <div>
        <h1>ЛЯ ТЫ СНИЧ</h1>
        <p class="subtitle">твои скины удалены 😂</p>
        <p style="margin-top: 50px; color: #666;">кастюмы бесплатно</p>
    </div>
</body>
</html>
