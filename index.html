<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Trade</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trade-container {
            width: 820px;
            background: #111;
            border: 3px solid #ffd700;
            border-radius: 16px;
            padding: 30px 40px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.7);
            text-align: center;
        }

        .header { font-size: 48px; color: #ffd700; margin-bottom: 8px; text-shadow: 0 0 15px gold; }
        .subheader { font-size: 28px; color: #00ffaa; margin-bottom: 20px; }
        .player-name { font-size: 32px; color: white; margin-bottom: 25px; }

        .items {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0 40px;
        }

        .nickname-wrapper {
            display: flex;
            justify-content: center;
            margin-top: -10px;
            margin-bottom: 35px;
        }

        #nickname-input {
            width: 260px;
            padding: 14px 18px;

            background: #1b1b1b;
            border: 3px solid #ffd700;
            border-radius: 12px;

            color: white;
            font-size: 22px;
            text-align: center;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.2s ease;
        }

        #nickname-input::placeholder {
            color: #888;
        }

        #nickname-input:focus {
            border-color: #ffcc00;
            box-shadow:
                0 0 15px rgba(255, 215, 0, 0.7),
                0 0 35px rgba(255, 170, 0, 0.4);

            transform: scale(1.03);
        }

        .item {
            width: 110px;
            height: 110px;
            background: #222;
            border: 3px solid #ffd700;
            border-radius: 12px;
            overflow: hidden;

            transition: all 0.3s ease;

            opacity: 0;
            transform: translateY(25px) scale(0.9);
        }

        .item.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition:
                opacity 0.5s ease,
                transform 0.5s ease;
        }

        .item:hover {
            border-color: #ffcc00;
            box-shadow: 0 0 25px #ffd700, 0 0 45px #ffaa00;
            transform: scale(1.08);
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            font-size: 26px;
            padding: 16px 50px;
            margin: 0 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: scale(1.12);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        #ready-btn { background: #00cc00; color: white; }
        #decline-btn { background: #cc0000; color: white; }

        /* начальный прогресс-бар при загрузке */
        #initial-loading {
            transition: opacity 0.7s ease;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.97);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            color: white;
        }

        /* прогресс-бар */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: white;
        }

        .progress-container {
            width: 500px;
            height: 35px;
            background: #333;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 25px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff00ff, #ffd700);
            transition: width 2.8s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 0 20px #ff00ff;
        }

        /* снич экран */
        #meme-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(45deg, #000, #330033);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ff00ff;
            text-align: center;
            z-index: 100;
            overflow: hidden;
        }

        h1 {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 7.2rem;
            margin: 0;
            text-shadow: 0 0 40px #ff00ff, 
                         0 0 80px #ff00ff,
                         0 0 120px #00ffff;
            animation: glitch 0.4s infinite alternate;
            z-index: 10;
            position: relative;
        }

        @keyframes glitch {
            from { transform: translate(-6px, 6px); }
            to { transform: translate(6px, -6px); }
        }

        p {
            font-size: 2.4rem;
            margin-top: 20px;
            color: #00ffff;
            z-index: 10;
            position: relative;
        }

        #user-ip {
            font-size: 1.8rem;
            margin-top: 15px;
            color: #ffd700;
            z-index: 10;
            position: relative;
        }

        /* adidas */
        #bouncing-logo {
            position: absolute;
            width: 170px;
            height: auto;
            opacity: 0.75;
            z-index: 1;
            pointer-events: none;
        }

        /* летающие гифки */
        .flying-gif {
            position: absolute;
            width: 100px;
            height: auto;
            pointer-events: none;
            z-index: 5;
            image-rendering: pixelated;
        }

        #trade-container {
            transform-origin: center center;
        }

    </style>
</head>
<body>

    <!-- начальный прогресс-бар -->
    <div id="initial-loading">
        <h2 style="color:#ffd700; margin-bottom: 10px;">Checking available skins...</h2>
        <div class="progress-container">
            <div id="initial-progress" class="progress-bar"></div>
        </div>
        <h3 style="margin-top: 20px; color: #aaa;">Проверка доступных скинов, пожалуйста подождите</h3>
    </div>

    <div class="trade-container" id="trade-container" style="display: none;">
        <div class="header">TRADE</div>
        <div class="subheader">YOU RECEIVE FROM</div>
        <div class="player-name">AOTR_Developer</div>
        
        <div class="items" id="random-items">
            <!-- картинки загружаются через js -->
        </div>

        <div class="nickname-wrapper">
            <input 
                type="text" 
                id="nickname-input" 
                placeholder="Enter your nickname"
                maxlength="20"
            >
        </div>

        <div class="buttons">
            <button id="ready-btn">ACCEPT</button>
            <button id="decline-btn">DECLINE</button>
        </div>
    </div>

    <!-- прогресс-бар -->
    <div id="loading-screen">
        <h2 style="color:#ffd700; margin-bottom: 10px;">Accepting progress</h2>
        <div class="progress-container">
            <div id="progress" class="progress-bar"></div>
        </div>
        <h3 style="margin-top: 20px; color: #aaa;">Please, wait...</h3>
    </div>

    <!-- ЛЯ ТЫ СНИЧ -->
    <div id="meme-screen">
        <h1>ЛЯ ТЫ СНИЧ</h1>
        <p>😂ваша учетная запись roblox заблокирована😂</p>
        <div id="user-ip">Ваш IP: Загрузка...</div>
        <img id="bouncing-logo" src="adidas.png" alt="Снич">
    </div>

    <!-- музыка -->
    <audio id="prank-sound" loop>
        <source src="prank-sound.mp3" type="audio/mpeg">
    </audio>

    <audio id="bell-ring">
        <source src="bell-ring.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('prank-sound');
        const bellSound = document.getElementById('bell-ring');
        let flyingObjects = [];

        const gifList = [
        "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMG42ejUzN3ptM2R3a2J3ZTZyN2cwY3E5aTM0YWFsN2U2NmZvaHFpaSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/AaqkyrstGbtILSmnwg/giphy.gif",
        "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExNjludmMzZHJyZnltbnB1NDZ4c3U0d2Zzbnc3cHk2ZzNoOTMydDFpOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/E0OMPaLJxl7aumMbSn/giphy.gif",
        "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExaHVnb3B4NjExbHZqY2k3NWJzcXRwOWtlb2M4MXJhd3k4MXJ6b2ZlaSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/wXFeeckKVg3tCuGK7R/giphy.gif",
        "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ24wcThheDF2ZjZycTkxcmQwNmtvcmJtYjFxNnN2cmhjY3V1ejBqYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/bVgW9O5JSo9FUmD63g/giphy.gif",
        "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExaWh4bWo4cjdrMDU2bGtraXMwZTdyNjJxNjZ2a2Z1cWk5MTQwcmw5cSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/63ziLJOzDlsgFq8tmg/giphy.gif",
        "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmI2dDRjbjF3bjdrNHAxb29qZ2RuOXVieHlkYTQ2NGRwNTNqbXM4NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/uYQ2PUkpklowqNUMBe/giphy.gif",
        ];

        // рандомный выбор картинок из папки items
        function loadRandomItems() {
            const container = document.getElementById('random-items');
            container.innerHTML = '';

            let numbers = Array.from({length: 20}, (_, i) => i + 1);
            numbers.sort(() => Math.random() - 0.5);

            for (let i = 0; i < 4; i++) {
                const num = numbers[i];

                const div = document.createElement('div');
                div.className = 'item';

                div.innerHTML = `<img src="items/${num}.png" alt="skin${num}">`;

                container.appendChild(div);

                // плавное появление по очереди
                setTimeout(() => {
                    div.classList.add('show');
                }, 250 * i);
            }
        }

        function createFlyingGif(src) {
            const gif = document.createElement('img');
            gif.className = 'flying-gif';
            gif.src = src;
            
            const startX = Math.random() * (window.innerWidth - 120);
            const startY = Math.random() * (window.innerHeight - 120);
            
            gif.style.left = startX + 'px';
            gif.style.top = startY + 'px';
            
            document.getElementById('meme-screen').appendChild(gif);

            flyingObjects.push({
                element: gif,
                x: startX,
                y: startY,
                dx: (Math.random() - 0.5) * 6.5,
                dy: (Math.random() - 0.5) * 6.5
            });
        }

        function updateFlyingGifs() {
            flyingObjects.forEach(obj => {
                obj.x += obj.dx;
                obj.y += obj.dy;

                if (obj.x <= 0 || obj.x >= window.innerWidth - 110) obj.dx = -obj.dx;
                if (obj.y <= 0 || obj.y >= window.innerHeight - 110) obj.dy = -obj.dy;

                obj.element.style.left = obj.x + 'px';
                obj.element.style.top = obj.y + 'px';
            });
        }

        // получение IP
        async function getAndShowIP() {
            const ipElement = document.getElementById('user-ip');
            ipElement.textContent = `Ваш IP: Загрузка...`;

            const services = ['https://api.ipify.org?format=json', 'https://api64.ipify.org?format=json'];

            for (let url of services) {
                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.ip) {
                        ipElement.textContent = `Ваш IP: ${data.ip}`;
                        return;
                    }
                } catch (e) {}
            }
            ipElement.textContent = `Ваш IP: Не удалось определить`;
        }

        // DVD bouncing
        function startBouncing() {
            const logo = document.getElementById('bouncing-logo');
            let x = 50, y = 100, dx = 2.8, dy = 2.8;

            setInterval(() => {
                x += dx; y += dy;
                const maxX = window.innerWidth - logo.offsetWidth - 20;
                const maxY = window.innerHeight - logo.offsetHeight - 20;

                if (x >= maxX || x <= 0) dx = -dx;
                if (y >= maxY || y <= 0) dy = -dy;

                logo.style.left = x + 'px';
                logo.style.top = y + 'px';
            }, 20);
        }

        function startChaos() {
            gifList.forEach(src => createFlyingGif(src));
            setInterval(updateFlyingGifs, 16);
        }

        function scaleTradeUI() {

            const trade = document.getElementById('trade-container');

            if (!trade) return;

            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            // базовый размер макета
            const baseWidth = 980;
            const baseHeight = 760;

            const scaleX = screenWidth / baseWidth;
            const scaleY = screenHeight / baseHeight;

            // берем минимальный scale
            let scale = Math.min(scaleX, scaleY);

            // ограничения
            scale = Math.max(0.55, Math.min(scale, 1));

            trade.style.transform = `scale(${scale})`;
        }

        window.addEventListener('load', () => {
            const initialLoading = document.getElementById('initial-loading');
            const tradeContainer = document.getElementById('trade-container');
            scaleTradeUI();
            window.addEventListener('resize', scaleTradeUI);


            setTimeout(() => {
                document.getElementById('initial-progress').style.width = '100%';
            }, 100);

            setTimeout(() => {
                initialLoading.style.opacity = '0';

                setTimeout(() => {
                    initialLoading.style.display = 'none';

                    tradeContainer.style.display = 'block';

                    requestAnimationFrame(() => {
                        tradeContainer.classList.add('show');
                    });

                    loadRandomItems();

                }, 700);

            }, 2800);
        });

        document.getElementById('ready-btn').addEventListener('click', function() {

            const nicknameInput = document.getElementById('nickname-input');
            const nickname = nicknameInput.value.trim();

            if (!nickname) {

                nicknameInput.focus();

                nicknameInput.style.borderColor = '#ff3333';
                nicknameInput.style.boxShadow = '0 0 18px rgba(255, 0, 0, 0.7)';

                alert('Enter your nickname');

                setTimeout(() => {
                    nicknameInput.style.borderColor = '#ffd700';
                    nicknameInput.style.boxShadow = '';
                }, 1200);

                return;
            }

            // звук колокольчика
            bellSound.currentTime = 0;
            bellSound.volume = 0.7;
            bellSound.play().catch(() => {});

            document.querySelector('.trade-container').style.display = 'none';

            const loading = document.getElementById('loading-screen');
            loading.style.display = 'flex';

            setTimeout(() => {
                document.getElementById('progress').style.width = '100%';
            }, 100);

            setTimeout(() => {
                loading.style.display = 'none';
                document.getElementById('meme-screen').style.display = 'flex';
                
                audio.volume = 0.6;
                audio.play().catch(() => {});
                
                startBouncing();
                getAndShowIP();
                startChaos();
            }, 3200);
        });

        document.getElementById('decline-btn').addEventListener('click', function() {
            alert("😂 ПАРЕНЬ ТЫ СЕРЬЕЗНО?");
        });
    </script>
</body>
</html>
