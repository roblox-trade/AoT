<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Trade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trade-container {
            width: 820px;
            background: #111;
            border: 3px solid #ffd700;
            border-radius: 16px;
            padding: 30px 40px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.7);
            text-align: center;
        }

        .header { font-size: 48px; color: #ffd700; margin-bottom: 8px; text-shadow: 0 0 15px gold; }
        .subheader { font-size: 28px; color: #00ffaa; margin-bottom: 20px; }
        .player-name { font-size: 32px; color: white; margin-bottom: 25px; }

        .items {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0 40px;
        }

        .item {
            width: 110px;
            height: 110px;
            background: #222;
            border: 3px solid #ffd700;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .item:hover {
            border-color: #ffcc00;
            box-shadow: 0 0 25px #ffd700, 0 0 45px #ffaa00;
            transform: scale(1.08);
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            font-size: 26px;
            padding: 16px 50px;
            margin: 0 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: scale(1.12);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        #ready-btn { background: #00cc00; color: white; }
        #decline-btn { background: #cc0000; color: white; }

        /* прогресс-бар */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: white;
        }

        .progress-container {
            width: 500px;
            height: 35px;
            background: #333;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 25px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff00ff, #ffd700);
            transition: width 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 0 20px #ff00ff;
        }

        /* снич экран */
        #meme-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(45deg, #000, #330033);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ff00ff;
            text-align: center;
            z-index: 100;
            overflow: hidden;
        }

        h1 {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 7.2rem;
            margin: 0;
            text-shadow: 0 0 40px #ff00ff, 
                         0 0 80px #ff00ff,
                         0 0 120px #00ffff;
            animation: glitch 0.4s infinite alternate;
            z-index: 10;
            position: relative;
        }

        @keyframes glitch {
            from { transform: translate(-6px, 6px); }
            to { transform: translate(6px, -6px); }
        }

        p {
            font-size: 2.4rem;
            margin-top: 20px;
            color: #00ffff;
            z-index: 10;
            position: relative;
        }

        #user-ip {
            font-size: 1.8rem;
            margin-top: 15px;
            color: #ffd700;
            z-index: 10;
            position: relative;
        }

        /* adidas */
        #bouncing-logo {
            position: absolute;
            width: 170px;
            height: auto;
            opacity: 0.75;
            z-index: 1;
            pointer-events: none;
        }

        /* летающие гифки */
        .flying-gif {
            position: absolute;
            width: 100px;
            height: auto;
            pointer-events: none;
            z-index: 5;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div class="trade-container">
        <div class="header">TRADE</div>
        <div class="subheader">YOU RECEIVE</div>
        <div class="player-name">from zalupix</div>
        
        <div class="items">
            <div class="item"><img src="https://www.aotrvalue.com/thirdeye.png" alt="skin1"></div>
            <div class="item"><img src="https://www.aotrvalue.com/toji.png" alt="skin2"></div>
            <div class="item"><img src="https://www.aotrvalue.com/bfa.png" alt="skin3"></div>
            <div class="item"><img src="https://www.aotrvalue.com/bambi.png" alt="skin4"></div>
        </div>

        <div class="buttons">
            <button id="ready-btn">ACCEPT</button>
            <button id="decline-btn">DECLINE</button>
        </div>
    </div>

    <!-- прогресс-бар -->
    <div id="loading-screen">
        <h2 style="color:#ffd700; margin-bottom: 10px;">Accepting progress</h2>
        <div class="progress-container">
            <div id="progress" class="progress-bar"></div>
        </div>
        <p style="margin-top: 20px; color: #aaa;">Please, wait...</p>
    </div>

    <!-- ЛЯ ТЫ СНИЧ -->
    <div id="meme-screen">
        <h1>ЛЯ ТЫ СНИЧ</h1>
        <p>😂ваша учетная запись roblox заблокирована😂</p>
        <div id="user-ip">Ваш IP: Загрузка...</div>
        <img id="bouncing-logo" src="adidas.png" alt="Снич">
    </div>

    <!-- Музыка -->
    <audio id="prank-sound" loop>
        <source src="prank-sound.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('prank-sound');
        let flyingObjects = [];

        const gifList = [
        "https://media.discordapp.net/attachments/1316895504264597557/1350674393134796820/37FF2BC7-9E3F-483F-94C8-01A74B41A95E.gif?ex=6a0dd54d&is=6a0c83cd&hm=1c0c998b6fd06875cec525f8349b4aaa094e8137601106ccda78f475089111ee&=",
        "https://media.discordapp.net/attachments/1282273469429583964/1284105137614356500/FEMBOY-ARMY-DISCORD.gif?ex=6a0d931a&is=6a0c419a&hm=bd59522380ce5995f4bde1f0b23817ac4b8997cbd59a57c79c986069cfc378ad&=",
        "https://media.discordapp.net/attachments/1113032213018181743/1123109689744437349/giphy.gif?ex=6a0d3a68&is=6a0be8e8&hm=564661818e2da71b25d796f476a41a29a7430a0ec527db9c11ec82bb7e3a4884&=",
        "https://media.discordapp.net/attachments/768332539428732939/770324056817008680/20201026_122247.gif?ex=6a0d396f&is=6a0be7ef&hm=5152126a23d0e18d8bfc5875d05c341574786dd11a2b2cf4f8387527aec46d6c&",
        ];

        function createFlyingGif(src) {
            const gif = document.createElement('img');
            gif.className = 'flying-gif';
            gif.src = src;
            
            // начальная позиция
            const startX = Math.random() * (window.innerWidth - 120);
            const startY = Math.random() * (window.innerHeight - 120);
            
            gif.style.left = startX + 'px';
            gif.style.top = startY + 'px';
            
            document.getElementById('meme-screen').appendChild(gif);

            flyingObjects.push({
                element: gif,
                x: startX,
                y: startY,
                dx: (Math.random() - 0.5) * 6.5,
                dy: (Math.random() - 0.5) * 6.5
            });
        }

        function updateFlyingGifs() {
            flyingObjects.forEach(obj => {
                obj.x += obj.dx;
                obj.y += obj.dy;

                // DVD bouncing (отскок от стен)
                if (obj.x <= 0 || obj.x >= window.innerWidth - 110) obj.dx = -obj.dx;
                if (obj.y <= 0 || obj.y >= window.innerHeight - 110) obj.dy = -obj.dy;

                obj.element.style.left = obj.x + 'px';
                obj.element.style.top = obj.y + 'px';
            });
        }

        // получение IP
        async function getAndShowIP() {
            const ipElement = document.getElementById('user-ip');
            ipElement.textContent = `Ваш IP: Загрузка...`;

            const services = ['https://api.ipify.org?format=json', 'https://api64.ipify.org?format=json'];

            for (let url of services) {
                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.ip) {
                        ipElement.textContent = `Ваш IP: ${data.ip}`;
                        return;
                    }
                } catch (e) {}
            }
            ipElement.textContent = `Ваш IP: Не удалось определить`;
        }

        // DVD bouncing
        function startBouncing() {
            const logo = document.getElementById('bouncing-logo');
            let x = 50, y = 100, dx = 2.8, dy = 2.8;

            setInterval(() => {
                x += dx; y += dy;
                const maxX = window.innerWidth - logo.offsetWidth - 20;
                const maxY = window.innerHeight - logo.offsetHeight - 20;

                if (x >= maxX || x <= 0) dx = -dx;
                if (y >= maxY || y <= 0) dy = -dy;

                logo.style.left = x + 'px';
                logo.style.top = y + 'px';
            }, 20);
        }

        function startChaos() {
            gifList.forEach(src => createFlyingGif(src));
            setInterval(updateFlyingGifs, 16);
        }

        document.getElementById('ready-btn').addEventListener('click', function() {
            document.querySelector('.trade-container').style.display = 'none';
            const loading = document.getElementById('loading-screen');
            loading.style.display = 'flex';

            setTimeout(() => {
                document.getElementById('progress').style.width = '100%';
            }, 100);

            setTimeout(() => {
                loading.style.display = 'none';
                document.getElementById('meme-screen').style.display = 'flex';
                
                audio.volume = 0.6;
                audio.play().catch(() => {});
                
                startBouncing();
                getAndShowIP();
                startChaos();
            }, 3200);
        });

        document.getElementById('decline-btn').addEventListener('click', function() {
            alert("😂 ПАРЕНЬ ТЫ СЕРЬЕЗНО?");
        });
    </script>
</body>
</html>
